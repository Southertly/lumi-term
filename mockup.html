<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: #1e1e2e;
  color: #cdd6f4;
  height: 100vh;
  display: flex;
  flex-direction: column;
}
.titlebar {
  height: 32px;
  background: #181825;
  display: flex;
  align-items: center;
  padding: 0 12px;
  border-bottom: 1px solid #11111b;
}
.titlebar-title { font-size: 13px; color: #cdd6f4; font-weight: 500; }

.tab-bar {
  height: 40px;
  background: #181825;
  display: flex;
  align-items: center;
  padding: 0 8px;
  gap: 4px;
  border-bottom: 1px solid #11111b;
}

/* Active tab */
.tab {
  height: 32px;
  min-width: 140px;
  background: #89b4fa;
  border: 1px solid #89b4fa;
  border-radius: 6px;
  display: flex;
  align-items: center;
  padding: 0 10px;
  gap: 8px;
  color: #11111b;
  flex-shrink: 0;
}
.tab-icon { font-size: 13px; flex-shrink: 0; }
.tab-title { flex: 1; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.tab-close {
  width: 16px; height: 16px;
  border-radius: 3px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; opacity: 0.6;
  cursor: pointer;
  transition: all 0.15s ease;
}
.tab-close:hover { opacity: 1; background: rgba(17,17,27,0.15); }

/* + button with dropdown */
.new-tab-wrapper { position: relative; }
.new-tab-btn {
  width: 32px; height: 32px;
  background: #1e1e2e;
  border: 1px solid #313244;
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all 0.15s ease;
  color: #89b4fa; font-size: 20px; line-height: 1;
  user-select: none;
}
.new-tab-btn:hover { background: #262637; border-color: #45475a; }
.new-tab-btn.open { background: #262637; border-color: #89b4fa; }

.dropdown {
  display: none;
  position: absolute;
  top: 36px;
  left: 0;
  background: #181825;
  border: 1px solid #313244;
  border-radius: 8px;
  overflow: hidden;
  min-width: 160px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  z-index: 100;
}
.dropdown.visible { display: block; }

.dropdown-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.1s ease;
  color: #cdd6f4;
}
.dropdown-item:hover { background: #313244; }
.dropdown-item .item-icon { font-size: 14px; width: 18px; text-align: center; }
.dropdown-item .item-label { flex: 1; }
.dropdown-item .item-hint { font-size: 11px; color: #6c7086; }

.dropdown-divider { height: 1px; background: #313244; margin: 2px 0; }

/* Terminal */
.terminal-area {
  flex: 1;
  background: #1e1e2e;
  padding: 12px;
  font-family: 'Cascadia Code', Consolas, monospace;
  font-size: 14px;
  color: #cdd6f4;
}
.ps-prompt { color: #89b4fa; }
.ps-path { color: #a6e3a1; }
.ps-cursor { display: inline-block; width: 8px; height: 16px; background: #f5e0dc; animation: blink 1s step-end infinite; vertical-align: text-bottom; }
@keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-title">LumiTerm</div>
  </div>

  <div class="tab-bar">
    <div class="tab">
      <span class="tab-icon">❯</span>
      <span class="tab-title">PowerShell</span>
      <span class="tab-close" onclick="alert('close tab')">×</span>
    </div>

    <div class="new-tab-wrapper">
      <div class="new-tab-btn" id="newTabBtn" onclick="toggleDropdown()">+</div>
      <div class="dropdown" id="dropdown">
        <div class="dropdown-item" onclick="openTab('powershell')">
          <span class="item-icon">❯</span>
          <span class="item-label">PowerShell</span>
          <span class="item-hint">Ctrl+T</span>
        </div>
        <div class="dropdown-item" onclick="openTab('cmd')">
          <span class="item-icon">⬛</span>
          <span class="item-label">CMD</span>
        </div>
        <div class="dropdown-divider"></div>
        <div class="dropdown-item" onclick="openTab('wsl2')">
          <span class="item-icon">🐧</span>
          <span class="item-label">WSL2</span>
        </div>
      </div>
    </div>
  </div>

  <div class="terminal-area">
    <div><span class="ps-prompt">PS </span><span class="ps-path">C:\Users\liu</span><span class="ps-prompt">&gt;</span> echo 你好世界</div>
    <div>你好世界</div>
    <div style="margin-top:4px"><span class="ps-prompt">PS </span><span class="ps-path">C:\Users\liu</span><span class="ps-prompt">&gt;</span> <span class="ps-cursor"></span></div>
  </div>

  <script>
    function toggleDropdown() {
      const btn = document.getElementById('newTabBtn');
      const dd = document.getElementById('dropdown');
      const open = dd.classList.toggle('visible');
      btn.classList.toggle('open', open);
    }
    function openTab(shell) {
      alert('打开新标签: ' + shell);
      document.getElementById('dropdown').classList.remove('visible');
      document.getElementById('newTabBtn').classList.remove('open');
    }
    document.addEventListener('click', (e) => {
      if (!e.target.closest('.new-tab-wrapper')) {
        document.getElementById('dropdown').classList.remove('visible');
        document.getElementById('newTabBtn').classList.remove('open');
      }
    });
  </script>
</body>
</html>
