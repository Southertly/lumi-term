<div class="question">
  <h2>标签拖拽动画方案</h2>
  <p>拖动标签时，其他标签如何让位？选择你喜欢的动画效果：</p>
</div>

<div class="options">
  <div class="option" data-choice="a">
    <h3>A. 即时交换</h3>
    <div class="demo-container">
      <div class="tab-bar">
        <div class="tab">Tab 1</div>
        <div class="tab dragging">Tab 2 (拖动中)</div>
        <div class="tab">Tab 3</div>
        <div class="tab">Tab 4</div>
      </div>
      <p class="note">拖过中点立即交换位置，无过渡动画</p>
    </div>
  </div>

  <div class="option" data-choice="b">
    <h3>B. 平滑滑动 (推荐)</h3>
    <div class="demo-container">
      <div class="tab-bar smooth">
        <div class="tab">Tab 1</div>
        <div class="tab dragging">Tab 2 (拖动中)</div>
        <div class="tab shifting">Tab 3 →</div>
        <div class="tab">Tab 4</div>
      </div>
      <p class="note">其他标签平滑滑动让位，150ms 过渡动画</p>
    </div>
  </div>

  <div class="option" data-choice="c">
    <h3>C. 弹性动画</h3>
    <div class="demo-container">
      <div class="tab-bar elastic">
        <div class="tab">Tab 1</div>
        <div class="tab dragging">Tab 2 (拖动中)</div>
        <div class="tab shifting">Tab 3 ↗</div>
        <div class="tab">Tab 4</div>
      </div>
      <p class="note">带弹性缓动效果，300ms 动画，更有趣但可能分散注意力</p>
    </div>
  </div>
</div>
